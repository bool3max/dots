# color configuration in a separate file
include tokyonight_night.conf

# achieve 160FPS rendering compared to the dafault 100FPS
repaint_delay 6

font_family Jetbrains Mono

# due to a PUA bug in NerdFonts (ryanoasis/nerd-fonts issue#560)
# this TTF occupies a portion of the unicode range which is not designated for PUA, which is just some arabic letters so I map them here
symbol_map U+FB50-U+FDFF Symbols Nerd Font

font_size 10
disable_ligatures always

inactive_text_alpha 0.8

tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}{[num_windows] if num_windows > 1 else ""}: {title}"
inactive_tab_font_style normal
active_tab_font_style bold

cursor_blink_interval 0.45
cursor_trail_decay 0.1 0.25
cursor_trail 25

# these 4 settings below are the defaults anyway
window_margin_width 0.0
single_window_margin_width -10.0
window_padding_width 5.0

# make window borders thicker
window_border_width 1.5pt

draw_minimal_borders no

# re-arrange layout order
enabled_layouts grid, fat, tall, horizontal, vertical, stack

# maximum number of lines to keep in the internal scrollback buffer
scrollback_lines 3000

# separate 5 MB buffer of scrollback history, only for use in a pager
scrollback_pager_history_size 5
# use neovim as scrollback page viewer
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

enable_audio_bell no

mouse_hide_wait 5.0
focus_follows_mouse no

# keyboard shortcuts:
# ------------------
# on macOS, I consider the ansi 'alt' key to be analogous to the macOS cmd key.
# this is in contrast how to how people think about it in general, usually the
# associated key on macOS is option. to me this makes no sense, as it's the
# alt and cmd keys which are in the same place on the keyboard, not alt and option.
# in fact, by defautl kitty treats 'alt' as 'option' in keybindings.
# thus, if I was really going with the flow and if I considered those key to be
# analogous, I could just define my shortcuts once for both linux and macOS
# i.e ctrl+alt+5 would mean literally ctrl+alt+5 on linux and ctrl+option+5 on macos
# without having to touch the config on macOS at all. but that's not the case,
# as what I really want is for ctrl+alt+5 to mean ctrl+cmd+5 on macos.
# THIS DOESN'T SEEM TO BE POSSIBLE: the kitty macos_option_as_alt is unrelated
# entirely: as i said, alt already means option to kitty: this config option just makes kitty
# capture option instead of it bringing up the macos alternative letter picker.
# to make matters worse, the kitty dedicated config option `remap_modifiers` doesn't allow naming
# the 'cmd' key. in an ideal world, i would just do `remap_modifiers alt:cmd`, and leave all my keybindings
# with 'alt', but it doesn't work -- the command doesn't accept `cmd` as a key. it _does_ accept `super`,
# (and I think kitty considers super and cmd to be anlogous), but even `remap_modifiers alt:super`
# doesn't work. so i'm left having to do a manual search and replace of 'alt'->'cmd' when i'm transferring
# my kitty config from linux to macos, for now
# TODO: open a discussion/issue on kitty github to see if anything can be done about this.
# ------------------

clear_all_shortcuts yes

map ctrl+alt+c copy_to_clipboard
map ctrl+alt+v paste_from_clipboard

# scroll one-line up/down
map ctrl+shift+e scroll_line_down smooth
map ctrl+shift+y scroll_line_up smooth
# scroll page up/down
map ctrl+alt+u scroll_page_up
map ctrl+alt+d scroll_page_down
# scroll to prev/next shell prompt
map ctrl+shift+{ scroll_to_prompt -1
map ctrl+shift+} scroll_to_prompt 1
# show entire scrollback buffer in pager
map ctrl+shift+p show_scrollback
# show last command output in pager
map ctrl+shift+i show_last_command_output

map ctrl+alt+r start_resizing_window

map ctrl+alt+o new_window_with_cwd
map ctrl+alt+b new_os_window_with_cwd
map ctrl+alt+w close_window

map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window bottom
map ctrl+alt+k neighboring_window top
map ctrl+alt+l neighboring_window right

map ctrl+alt+i focus_visible_window

map ctrl+shift+k move_window up
map ctrl+shift+h move_window left
map ctrl+shift+l move_window right
map ctrl+shift+j move_window down

map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
map ctrl+alt+0 goto_tab 0

map ctrl+alt+e new_tab_with_cwd !neighbor
map ctrl+alt+q close_tab
map ctrl+shift+s set_tab_title

map ctrl+alt+n previous_tab
map ctrl+alt+m next_tab

map ctrl+shift+n move_tab_backward
map ctrl+shift+m move_tab_forward


map ctrl+alt+p next_layout
map ctrl+alt+f toggle_layout stack

map ctrl+alt+equal change_font_size all +0.5
map ctrl+alt+minus change_font_size all -0.5
map ctrl+shift+equal change_font_size all +0.1
map ctrl+shift+minus change_font_size all -0.1
map ctrl+alt+0 change_font_size all 0
